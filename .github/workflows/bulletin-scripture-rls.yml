name: Bulletin scripture migration and RLS

on:
  push:
    branches:
      - test/bulletin-scripture-rls
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The complete historical chain cannot clean-reset: unrelated directory data corrections,
      # pg_cron jobs, and usage snapshots depend on production-era data or services. Do not
      # alter those migrations here. Build the exact minimum dependency chain for the target:
      # profiles/bulletins/get_user_role, Bible books, then scripture readings.
      - name: Assemble isolated minimum dependency migration chain
        run: |
          TEST_PROJECT="$RUNNER_TEMP/chflow-rls-project"
          TEST_SUPABASE="$TEST_PROJECT/supabase"
          mkdir -p "$TEST_SUPABASE/migrations"
          cp MS_AX/chflow-project/supabase/config.toml "$TEST_SUPABASE/config.toml"
          cp MS_AX/chflow-project/supabase/migrations/20260410000000_init_chflow.sql "$TEST_SUPABASE/migrations/"
          cp MS_AX/chflow-project/supabase/migrations/20260709100000_bible_core.sql "$TEST_SUPABASE/migrations/"
          cp MS_AX/chflow-project/supabase/migrations/20260914100000_bulletin_scripture_readings.sql "$TEST_SUPABASE/migrations/"
          echo "SUPABASE_TEST_DIR=$TEST_PROJECT" >> "$GITHUB_ENV"

      - name: Start isolated local Supabase
        working-directory: ${{ env.SUPABASE_TEST_DIR }}
        run: supabase start

      - name: Apply target dependency migration chain
        working-directory: ${{ env.SUPABASE_TEST_DIR }}
        run: supabase db reset --local --no-seed

      - name: Verify schema and RLS through actual authenticated queries
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < MS_AX/chflow-project/supabase/tests/bulletin_scripture_readings_rls.sql

      - name: Clean reset and reapply target dependency chain
        working-directory: ${{ env.SUPABASE_TEST_DIR }}
        run: supabase db reset --local --no-seed

      - name: Re-run schema and RLS verification after reset
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < MS_AX/chflow-project/supabase/tests/bulletin_scripture_readings_rls.sql
