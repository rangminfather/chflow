name: Bulletin scripture migration and RLS

on:
  push:
    branches:
      - test/bulletin-scripture-rls
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The repository's full clean migration chain currently stops before the target
      # migration at historical directory OCR correction files and local-only pg_cron jobs:
      # the former insert member_relations for absent directory data, while the latter require
      # the pg_cron extension that this local config does not provision.
      # That historical data correction is deliberately not changed by this verification.
      # For the target migration/RLS test, use the same schema migrations except that one
      # data-only correction, so the database can be built and queried in isolation.
      - name: Assemble isolated schema without historical data-only blocker
        run: |
          TEST_PROJECT="$RUNNER_TEMP/chflow-rls-project"
          TEST_SUPABASE="$TEST_PROJECT/supabase"
          mkdir -p "$TEST_SUPABASE/migrations"
          cp MS_AX/chflow-project/supabase/config.toml "$TEST_SUPABASE/config.toml"
          find MS_AX/chflow-project/supabase/migrations -maxdepth 1 -type f \
            ! -name '20260520080000_directory_ocr_user_confirmed_batch2.sql' \
            ! -name '20260520120000_directory_ocr_manual_pdf_mdb_corrections.sql' \
            ! -name '20260708190000_usage_resource_watch.sql' \
            ! -name '20260817090000_usage_diagnostics_v2.sql' \
            -exec cp {} "$TEST_SUPABASE/migrations/" \;
          echo "SUPABASE_TEST_DIR=$TEST_PROJECT" >> "$GITHUB_ENV"

      - name: Start isolated local Supabase
        working-directory: ${{ env.SUPABASE_TEST_DIR }}
        run: supabase start

      - name: Apply full migration chain
        working-directory: ${{ env.SUPABASE_TEST_DIR }}
        run: supabase db reset --local --no-seed

      - name: Verify schema and RLS through actual authenticated queries
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < MS_AX/chflow-project/supabase/tests/bulletin_scripture_readings_rls.sql

      - name: Clean reset and reapply full migration chain
        working-directory: ${{ env.SUPABASE_TEST_DIR }}
        run: supabase db reset --local --no-seed

      - name: Re-run schema and RLS verification after reset
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < MS_AX/chflow-project/supabase/tests/bulletin_scripture_readings_rls.sql
