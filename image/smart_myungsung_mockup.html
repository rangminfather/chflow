<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>스마트명성 — UI Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:       #F5F1EB;
  --card:     #FFFFFF;
  --green:    #2B4539;
  --green-md: #3D6152;
  --green-lt: #EDF2EF;
  --gold:     #B8963E;
  --gold-lt:  #F5EDD8;
  --ink:      #1A1A18;
  --ink-mid:  #4A4540;
  --ink-soft: #7A7570;
  --ink-mute: #A8A3A0;
  --border:   #E8E3DA;
  --shadow:   rgba(26,22,18,0.06);
}

body {
  background: #DEDBD4;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 48px 24px 72px;
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
}

/* ── Phone Shell ── */
.phone {
  width: 390px;
  border-radius: 54px;
  background: #1A1A1A;
  padding: 14px;
  box-shadow:
    0 0 0 1px #3A3A3A,
    0 48px 96px rgba(0,0,0,0.50),
    0 16px 32px rgba(0,0,0,0.28),
    inset 0 1px 0 rgba(255,255,255,0.08);
  position: relative;
}

/* Side buttons */
.phone::before {
  content:'';
  position:absolute;
  left:-3px; top:120px;
  width:3px; height:36px;
  background:#2A2A2A;
  border-radius:2px 0 0 2px;
  box-shadow: 0 52px 0 #2A2A2A, 0 98px 0 #2A2A2A;
}
.phone::after {
  content:'';
  position:absolute;
  right:-3px; top:160px;
  width:3px; height:64px;
  background:#2A2A2A;
  border-radius:0 2px 2px 0;
}

/* ── Screen ── */
.screen {
  background: var(--bg);
  border-radius: 42px;
  overflow: hidden;
  height: 844px;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* Dynamic Island */
.island {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 34px;
  background: #000;
  border-radius: 18px;
  z-index: 50;
}

/* ── Status Bar ── */
.status {
  flex-shrink: 0;
  padding: 58px 28px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 58px;
}
.status-time {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.3px;
}
.status-icons {
  display: flex;
  align-items: center;
  gap: 5px;
}

/* ── Scrollable content ── */
.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 28px;
}
.scroll::-webkit-scrollbar { display:none; }

/* ── Header ── */
.header {
  padding: 10px 20px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
}
.brand-mark {
  width: 32px;
  height: 32px;
  background: var(--green);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.brand-names .ko {
  font-size: 16px;
  font-weight: 900;
  color: var(--ink);
  letter-spacing: -0.6px;
  line-height: 1.15;
}
.brand-names .en {
  font-size: 7.5px;
  font-weight: 600;
  color: var(--ink-mute);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.header-actions {
  display: flex;
  gap: 6px;
}
.hbtn {
  width: 36px;
  height: 36px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 0 1px 4px var(--shadow);
}
.ndot {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 5px;
  height: 5px;
  background: var(--gold);
  border-radius: 50%;
  border: 1.5px solid var(--bg);
}

/* ── Profile Card ── */
.profile-card {
  margin: 4px 16px 16px;
  background: var(--card);
  border-radius: 22px;
  border: 1px solid var(--border);
  box-shadow: 0 2px 16px var(--shadow), 0 1px 3px rgba(0,0,0,0.04);
  overflow: hidden;
  position: relative;
}
/* Subtle gold accent top-right */
.profile-card::after {
  content:'';
  position:absolute;
  top:-30px; right:-30px;
  width:110px; height:110px;
  background: radial-gradient(circle, rgba(184,150,62,0.10) 0%, transparent 70%);
  border-radius:50%;
  pointer-events:none;
}
.profile-main {
  padding: 20px 18px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
}
/* Decorative botanicals */
.profile-deco {
  position: absolute;
  top: 8px;
  right: 12px;
  opacity: 0.55;
}
.avatar-ring {
  width: 62px;
  height: 62px;
  border-radius: 18px;
  background: var(--green-lt);
  border: 2px solid var(--border);
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
  cursor: pointer;
}
.profile-text {
  flex: 1;
  min-width: 0;
}
.prof-name {
  font-size: 18px;
  font-weight: 900;
  color: var(--ink);
  letter-spacing: -0.6px;
  line-height: 1.1;
}
.prof-title {
  margin-top: 3px;
  font-size: 11px;
  font-weight: 600;
  color: var(--green-md);
  letter-spacing: 0.1px;
}
.prof-greet {
  margin-top: 5px;
  font-size: 10.5px;
  color: var(--ink-soft);
  font-weight: 400;
  line-height: 1.4;
}
.profile-btn {
  flex-shrink: 0;
  padding: 8px 13px;
  background: var(--green-lt);
  border: 1px solid rgba(43,69,57,0.15);
  border-radius: 9px;
  font-size: 11px;
  font-weight: 700;
  color: var(--green);
  cursor: pointer;
  white-space: nowrap;
  align-self: flex-start;
  margin-top: 2px;
}
.profile-sep {
  height: 1px;
  background: var(--border);
  margin: 0 18px;
  opacity: 0.7;
}
.profile-stats {
  padding: 12px 20px;
  display: flex;
  justify-content: space-around;
}
.ps-item { text-align: center; }
.ps-val {
  font-size: 15px;
  font-weight: 800;
  color: var(--green);
  letter-spacing: -0.3px;
}
.ps-label {
  font-size: 9.5px;
  color: var(--ink-mute);
  margin-top: 2px;
  font-weight: 500;
}
.ps-div {
  width: 1px;
  background: var(--border);
  align-self: stretch;
}

/* ── Section ── */
.section { padding: 0 16px; margin-bottom: 18px; }
.sec-hd { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:12px; }
.sec-left .sec-title {
  font-size: 13.5px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.3px;
}
.sec-left .sec-sub {
  font-size: 9.5px;
  color: var(--ink-mute);
  font-weight: 400;
  margin-top: 1px;
}

/* ── Ministry Cards ── */
.ministry-row {
  display: flex;
  gap: 9px;
  margin-bottom: 9px;
}
.mc {
  flex: 1;
  background: var(--card);
  border-radius: 16px;
  padding: 13px 12px 12px;
  border: 1px solid var(--border);
  box-shadow: 0 1px 6px var(--shadow);
}
.mc-icon {
  width: 34px;
  height: 34px;
  background: var(--green-lt);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 9px;
}
.mc-name {
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.2px;
  margin-bottom: 2px;
}
.mc-cat {
  font-size: 9px;
  color: var(--ink-mute);
  font-weight: 500;
  margin-bottom: 8px;
}
.badge-ok {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 7px;
  background: var(--green-lt);
  border-radius: 5px;
}
.badge-ok-dot { width:4px; height:4px; background:var(--green-md); border-radius:50%; }
.badge-ok-txt { font-size:9px; font-weight:700; color:var(--green-md); }
.add-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px;
  background: transparent;
  border: 1.5px dashed #C8C0B4;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
  cursor: pointer;
}

/* ── Common Menu Grid ── */
.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.menu-card {
  background: var(--card);
  border-radius: 16px;
  padding: 15px 14px;
  border: 1px solid var(--border);
  box-shadow: 0 1px 5px var(--shadow);
}
.mi-wrap {
  width: 36px;
  height: 36px;
  background: var(--green-lt);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
}
.mi-label {
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink);
  margin-bottom: 2px;
  letter-spacing: -0.2px;
}
.mi-sub {
  font-size: 9.5px;
  color: var(--ink-mute);
  font-weight: 400;
}

/* ── Admin section ── */
.admin-wrap {
  background: #FAFAF8;
  border-top: 1px solid var(--border);
  padding: 18px 16px 24px;
}
.admin-hd {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.admin-title {
  font-size: 13.5px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.3px;
}
.admin-pill {
  padding: 2px 7px;
  background: var(--gold-lt);
  border-radius: 5px;
  font-size: 8.5px;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: 0.8px;
  text-transform: uppercase;
}
.admin-sub {
  font-size: 9.5px;
  color: var(--ink-mute);
  font-weight: 400;
  margin-bottom: 12px;
}
.admin-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}
.ac {
  background: var(--card);
  border-radius: 13px;
  padding: 12px 8px;
  border: 1px solid var(--border);
  text-align: center;
  box-shadow: 0 1px 4px var(--shadow);
}
.ac-icon {
  width: 32px;
  height: 32px;
  background: var(--gold-lt);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 7px;
}
.ac-label {
  font-size: 10.5px;
  font-weight: 800;
  color: var(--ink);
  margin-bottom: 2px;
  letter-spacing: -0.1px;
}
.ac-sub {
  font-size: 8.5px;
  color: var(--ink-mute);
  font-weight: 400;
}
</style>
</head>
<body>

<div class="phone">
  <div class="island"></div>

  <div class="screen">

    <!-- Status Bar -->
    <div class="status">
      <span class="status-time">11:32</span>
      <div class="status-icons">
        <!-- Signal -->
        <svg width="17" height="11" fill="none" viewBox="0 0 17 11">
          <rect x="0" y="7" width="3" height="4" rx="0.8" fill="#1A1A18"/>
          <rect x="4.5" y="4.5" width="3" height="6.5" rx="0.8" fill="#1A1A18"/>
          <rect x="9" y="2" width="3" height="9" rx="0.8" fill="#1A1A18"/>
          <rect x="13.5" y="0" width="3" height="11" rx="0.8" fill="#1A1A18"/>
        </svg>
        <!-- WiFi -->
        <svg width="15" height="11" fill="none" viewBox="0 0 15 11">
          <path d="M7.5 8.5a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" fill="#1A1A18"/>
          <path d="M3.6 6.2A5.4 5.4 0 017.5 4.8a5.4 5.4 0 013.9 1.4" stroke="#1A1A18" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M1 3.6A9 9 0 017.5 1a9 9 0 016.5 2.6" stroke="#1A1A18" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <!-- Battery -->
        <svg width="24" height="12" fill="none" viewBox="0 0 24 12">
          <rect x=".6" y=".6" width="19.8" height="10.8" rx="2.6" stroke="#1A1A18" stroke-width="1.2"/>
          <rect x="2" y="2" width="14" height="8" rx="1.5" fill="#1A1A18"/>
          <path d="M22 4v4" stroke="#1A1A18" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="scroll">

      <!-- ── Header ── -->
      <div class="header">
        <div class="brand">
          <div class="brand-mark">
            <!-- Church / cross mark -->
            <svg width="18" height="18" fill="none" viewBox="0 0 18 18">
              <path d="M9 2v14M5 7h8" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <path d="M3 16h12" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
            </svg>
          </div>
          <div class="brand-names">
            <div class="ko">스마트명성</div>
            <div class="en">SMART MYUNGSUNG</div>
          </div>
        </div>
        <div class="header-actions">
          <div class="hbtn">
            <!-- Bell -->
            <svg width="16" height="17" fill="none" viewBox="0 0 16 17">
              <path d="M8 1.5A5 5 0 003 6.5v3.8l-1 1.7h12l-1-1.7V6.5A5 5 0 008 1.5z" stroke="#1A1A18" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M6.5 13.5c0 .8.7 1.5 1.5 1.5s1.5-.7 1.5-1.5" stroke="#1A1A18" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <div class="ndot"></div>
          </div>
          <div class="hbtn">
            <!-- Hamburger -->
            <svg width="16" height="12" fill="none" viewBox="0 0 16 12">
              <path d="M1 1h14M1 6h14M1 11h14" stroke="#1A1A18" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- ── Profile Card ── -->
      <div class="profile-card">
        <!-- Botanical deco top-right -->
        <div class="profile-deco">
          <svg width="56" height="52" fill="none" viewBox="0 0 56 52">
            <path d="M44 4 C44 4 30 8 28 24" stroke="#B8963E" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
            <path d="M44 4 C40 14 34 14 28 24" stroke="#B8963E" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
            <ellipse cx="36" cy="12" rx="6" ry="4" transform="rotate(-30 36 12)" fill="#B8963E" opacity="0.12"/>
            <path d="M28 24 C24 32 22 42 24 50" stroke="#B8963E" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
            <ellipse cx="20" cy="36" rx="5" ry="3.5" transform="rotate(-50 20 36)" fill="#B8963E" opacity="0.10"/>
            <path d="M28 24 C32 28 38 30 42 36" stroke="#B8963E" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
            <ellipse cx="40" cy="30" rx="4" ry="3" transform="rotate(20 40 30)" fill="#B8963E" opacity="0.09"/>
          </svg>
        </div>

        <div class="profile-main">
          <!-- Avatar -->
          <div class="avatar-ring">
            <svg width="62" height="62" viewBox="0 0 62 62" fill="none">
              <rect width="62" height="62" fill="#C6D4C4"/>
              <circle cx="31" cy="23" r="10" fill="#8FA88F"/>
              <ellipse cx="31" cy="50" rx="17" ry="11" fill="#8FA88F"/>
            </svg>
          </div>
          <!-- Text -->
          <div class="profile-text">
            <div class="prof-name">최성현님</div>
            <div class="prof-title">사무집사 · 목자</div>
            <div class="prof-greet">오늘도 평안한 하루 되세요</div>
          </div>
        </div>
      </div>

      <!-- ── 내 사역 · 부서 ── -->
      <div class="section">
        <div class="sec-hd">
          <div class="sec-left">
            <div class="sec-title">내 사역 · 부서</div>
          </div>
        </div>

        <div class="ministry-row">
          <!-- 유치부 -->
          <div class="mc">
            <div class="mc-icon">
              <svg width="18" height="18" fill="none" viewBox="0 0 18 18">
                <circle cx="9" cy="7" r="3.2" stroke="#2B4539" stroke-width="1.5"/>
                <path d="M3 17c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#2B4539" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="mc-name">유치부</div>
            <div class="mc-cat">교육사역국</div>
            <div class="badge-ok">
              <div class="badge-ok-dot"></div>
              <div class="badge-ok-txt">승인됨</div>
            </div>
          </div>

          <!-- 초등1부 -->
          <div class="mc">
            <div class="mc-icon">
              <svg width="18" height="18" fill="none" viewBox="0 0 18 18">
                <path d="M2 16V8l7-5 7 5v8" stroke="#2B4539" stroke-width="1.5" stroke-linejoin="round"/>
                <rect x="6" y="10" width="6" height="6" rx="1" stroke="#2B4539" stroke-width="1.4"/>
              </svg>
            </div>
            <div class="mc-name">초등1부</div>
            <div class="mc-cat">교육사역국</div>
            <div class="badge-ok">
              <div class="badge-ok-dot"></div>
              <div class="badge-ok-txt">승인됨</div>
            </div>
          </div>

          <!-- 초등2부 -->
          <div class="mc">
            <div class="mc-icon">
              <svg width="18" height="18" fill="none" viewBox="0 0 18 18">
                <path d="M2 16V8l7-5 7 5v8" stroke="#2B4539" stroke-width="1.5" stroke-linejoin="round"/>
                <rect x="6" y="10" width="6" height="6" rx="1" stroke="#2B4539" stroke-width="1.4"/>
                <path d="M9 10v6" stroke="#2B4539" stroke-width="1.2"/>
              </svg>
            </div>
            <div class="mc-name">초등2부</div>
            <div class="mc-cat">교육사역국</div>
            <div class="badge-ok">
              <div class="badge-ok-dot"></div>
              <div class="badge-ok-txt">승인됨</div>
            </div>
          </div>
        </div>

        <div class="add-btn">
          <svg width="13" height="13" fill="none" viewBox="0 0 13 13">
            <circle cx="6.5" cy="6.5" r="5.8" stroke="#7A7570" stroke-width="1.2"/>
            <path d="M6.5 3.5v6M3.5 6.5h6" stroke="#7A7570" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          사역 · 부서 가입
        </div>
      </div>

      <!-- ── 공통 메뉴 ── -->
      <div class="section">
        <div class="sec-hd">
          <div class="sec-left">
            <div class="sec-title">공통 메뉴</div>
          </div>
        </div>

        <div class="menu-grid">
          <!-- 주보 보기 -->
          <div class="menu-card">
            <div class="mi-wrap">
              <svg width="18" height="18" fill="none" viewBox="0 0 18 18">
                <rect x="2" y="2.5" width="14" height="13" rx="2" stroke="#2B4539" stroke-width="1.5"/>
                <path d="M5 7h8M5 10.5h5.5" stroke="#2B4539" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="mi-label">주보 보기</div>
          </div>

          <!-- 성도 요람 -->
          <div class="menu-card">
            <div class="mi-wrap">
              <svg width="18" height="18" fill="none" viewBox="0 0 18 18">
                <circle cx="7.5" cy="7" r="3" stroke="#2B4539" stroke-width="1.5"/>
                <path d="M2 16c0-3 2.5-5.5 5.5-5.5S13 13 13 16" stroke="#2B4539" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="14" cy="5" r="2.4" stroke="#2B4539" stroke-width="1.3" fill="white"/>
                <path d="M14 3.8v1.6M13.2 4.6h1.6" stroke="#2B4539" stroke-width="1" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="mi-label">성도 요람</div>
          </div>

          <!-- 불편신고/건의 -->
          <div class="menu-card">
            <div class="mi-wrap">
              <svg width="18" height="18" fill="none" viewBox="0 0 18 18">
                <path d="M3 14V5a2 2 0 012-2h8a2 2 0 012 2v6a2 2 0 01-2 2H6l-3 3z" stroke="#2B4539" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M7 7h4M7 9.5h2.5" stroke="#2B4539" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </div>
