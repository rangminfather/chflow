[package]
name = "chflow-desktop"
version = "0.1.0"
description = "CHFlow 데스크톱 메신저"
authors = ["CHFlow"]
edition = "2021"

# Tauri v2: lib + bin 구조. main.rs 가 lib 의 run() 호출.
[lib]
name = "chflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows Credential Manager 기반 보안 저장(우선안 Q-2). Windows 전용 빌드.
keyring = { version = "3", features = ["windows-native"] }

[features]
# 기본 features
default = []
